<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartChoice — умный выбор</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <div class="logo">Smart<span>Choice</span></div>
    <p>Находи лучшее. Сравнивай цены. Выбирай умно.</p>
</header>

<main class="container">

    <section class="search-section">
        <h1>Найди лучший товар</h1>
        <p>Сравни цены и выбери выгодное предложение</p>

        <div class="search-box">
            <input type="text" id="searchInput"
                   placeholder="Например, Samsung Galaxy S24...">
            <button id="searchButton">Найти</button>
        </div>
    </section>

    <section class="categories-section">
        <h2>Категории</h2>

        <div class="categories">
            <button class="category active" data-category="all">🌐 Все товары</button>
            <button class="category" data-category="smartphones">📱 Смартфоны</button>
            <button class="category" data-category="computers">💻 Компьютеры</button>
            <button class="category" data-category="accessories">🎧 Аксессуары</button>
            <button class="category" data-category="home">🏠 Для дома</button>
            <button class="category" data-category="games">🎮 Игры</button>
            <button class="category" data-category="gadgets">⌚ Гаджеты</button>
        </div>
    </section>

    <section class="products-section">
        <div class="section-heading">
            <h2 id="catalogTitle">Все товары</h2>
            <span id="productsCount"></span>
        </div>

        <div id="searchResults" class="products-grid"></div>
    </section>

</main>

<div id="compareModal" class="modal">
    <div class="modal-content">
        <button class="close-button" id="closeModal">×</button>
        <h2 id="modalTitle">Сравнение цен</h2>
        <div id="priceResults"></div>
        <p class="demo-note">Демонстрационные цены — не реальные предложения магазинов.</p>
    </div>
</div>

<footer>
    <p>© 2026 SmartChoice. Умный выбор начинается здесь.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
